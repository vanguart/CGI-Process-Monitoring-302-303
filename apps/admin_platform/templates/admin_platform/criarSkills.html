{% extends 'main/main.html' %}

{% block style %}

{% load static %}
<link rel="stylesheet" type="text/css" href="{% static 'css/admin_platform/criarSkills.css' %}"/>

{% endblock style %}


{% block main %}

<div class="split left">

    <div class="centered"> 
        
        <h2>Lista de Skills</h2>
        <br><br>

        <div class="TeamTasks">

            {% for skill in skills %}

                <div>
                    <p>Skill: {{ skill }}</p>
                    
                    <button>
                        <a href="{% url 'criarSkills_delete' skill.id %}" class="apagar"
                        style="color:black;text-decoration: none;">Apagar</a>
                    </button>
                    
                </div>

            {% endfor %}
            
        </div>

    </div>

</div>

<div class="split right">

    <div class="centered">

        <h2>Criar Skill</h2>
        <br><br>

        <div class="TeamTasks">

            <div>

                <form method = "post" enctype="multipart/form-data">
                    <div>
                        {% csrf_token %}
                        {{ form.as_p }}
                    </div>
                    <input type="submit" value="Gravar" class="btn btn-success">
                </form>
            

            </div>

        </div>

    </div>

</div>



{% endblock %}
