<link href="https://fonts.googleapis.com/css2?family=Oswald&display=swap" rel="stylesheet">

{% block style %}

    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/login.css' %}"/>

{% endblock style %}



{% block main %}

<div class="background">

    <div class="loginBackground">

        <div>
            <div class="CGI Title">
                
                <h4><span class="spanColorCGI">CGI</span> Process Monitoring</h4>
                
            </div>

            <h3>Recuperar Palavra-passe</h3>

            <p class="messageInvalidLogin">
                {% if message %}
                    {{ message }}
                {% endif %}
            </p>

            <form action="{% url 'process_monitor:recuperarPasswordPwUpdate' %}" method="post">
                {% csrf_token %}

                <p class="inputTitle">Nova Palavra-passe:</p>
                <input type="password" name="password1" placeholder="Nova Palavra-passe" class="inputBox">

                <p class="inputTitle">Confirmar Nova Palavra-passe:</p>
                <input type="password" name="password2" placeholder="Nova Palavra-passe" class="inputBox">
                
                <input type="submit" value="Continuar" class="btnSubmit">
               
            </form>
        </div>

    </div>

</div>

{% endblock %}
