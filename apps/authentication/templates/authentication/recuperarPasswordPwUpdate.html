<link href="https://fonts.googleapis.com/css2?family=Oswald&display=swap" rel="stylesheet">

{% block style %}

    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/authentication/login.css' %}"/>

{% endblock style %}



{% block main %}

<div class="background">
    <div class="loginBackground">
            <img class="logo" src="{% static 'images/logo.png' %}">

            <h3 id="form-title">Recuperar Palavra-passe</h3>

            <p class="messageInvalidLogin">
                {% if message %}
                    {{ message }}
                {% endif %}
            </p>

            <form action="{% url 'recuperarPasswordPwUpdate' %}" method="post">
                {% csrf_token %}
                <div class="input-container">
                    <input type="password" name="password1" id="input-password1" required="">
                    <label for="input-password1" class="label">Nova Palavra-passe</label>
                    <div class="underline"></div>
                </div>

                <div class="input-container">
                    <input type="password" name="password2" id="input-password2" required="">
                    <label for="input-password2" class="label">Confirmar Nova Palavra-passe</label>
                    <div class="underline"></div>
                </div>
                
                <input type="submit" value="Continuar" class="btnSubmit">
               
            </form>
        </div>
    </div>
</div>

{% endblock %}
