<link href="https://fonts.googleapis.com/css2?family=Oswald&display=swap" rel="stylesheet">

{% block style %}

    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/authentication/login.css' %}"/>

{% endblock style %}


{% block main %}

<div class="background">
    <div class="loginBackground">
        <div>
            <img class="logo" src="{% static 'images/logo.png' %}">
            <h3 id="form-title">Introduza as suas Credenciais</h3>

            <p class="messageInvalidLogin">
                {% if message %}
                    {{ message }}
                {% endif %}
            </p>

            <form action="{% url 'login' %}" method="post">
                {% csrf_token %}
                <div class="input-container">
                    <input type="text" name="username" id="input-username" required="">
                    <label for="input-username" class="label">Utilizador</label>
                    <div class="underline"></div>
                </div>

                <div class="input-container">
                    <input type="password" name="password" id="input-password" required="">
                    <label for="input-password" class="label">Palavra-passe</label>
                    <div class="underline"></div>
                </div>

                <a class="recuperarPassword" href="{% url 'recuperarPassword' %}">recuperar palavra-passe</a>

                <input type="submit" value="Entrar" class="btnSubmit">
               
            </form>
        </div>
    </div>
</div>

{% endblock %}
