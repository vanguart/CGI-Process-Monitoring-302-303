{% extends 'main/main.html' %}

{% block style %}

{% load static %}
<link rel="stylesheet" type="text/css" href="{% static 'css/operational_platform/correcaoDocumentos.css' %}"/>


{% endblock style %}


{% block main %}



<div class="split left">

    <div class="centered">

        <div class="Documento">
            <h2>Documento a ser corrigido</h2>
            <br>
           <iframe src="{{file}}" style="width:100%; height:100%;" frameborder="0"></iframe></div>
    </div>

</div>
</div>

<div class="split right">

    <div class="centered">

        <h2>(FORMULARIO QUE RECEBE DADOS PARA CORRIGIR)</h2>

        <p>Nome do objeto a passar para esta pagina: {{teamtasks}}</p>

        <form method="POST" enctype="multipart/form-data">
           
            <div>
                {% csrf_token %}
                {{ form.as_p }}
            </div>

            <input type="submit" value="Gravar" class="btn btn-success">
            
            <button>
                <a href="{% url 'businessExceptions' %}" role="button" class="btnCancel">Cancelar</a>
            </button>
            

        </form>

    </div>
</div>

{% endblock %}
