{% extends 'main/main.html' %}

{% block style %}

    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/operational_platform/reportarErrosNoSistema.css' %}"/>


{% endblock style %}


{% block main %}
{% include 'main/side_drawer.html' %}

<div class="background">
   
    <div class="centered">
      
        <h2>Reporte um Erro</h2>
        
        <br><br>
        
        <form method = "post" enctype="multipart/form-data">
            <div>
                {% csrf_token %}
                {{ form.as_p }}
            </div>
            <input type="submit" value="Gravar" class="btn btn-success">
        </form>

    </div>
</div>


{% endblock %}
